
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Veletti Studio - criação de sites modernos, profissionais e personalizados.">
<title>Veletti Studio | Experiências Digitais</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Orbitron:wght@500;600;700;800&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    scroll-behavior: smooth;
}

:root {
    --bg: #050b18;
    --bg-card: #0c172b;
    --blue: #1677ff;
    --cyan: #00d9ff;
    --white: #f4f8ff;
    --muted: #9aabc5;
    --border: rgba(71, 151, 255, .2);
}

body {
    background: var(--bg);
    color: var(--white);
    font-family: "DM Sans", sans-serif;
    overflow-x: hidden;
}

a {
    color: inherit;
    text-decoration: none;
}

button {
    font-family: inherit;
    cursor: pointer;
}

img {
    width: 100%;
    display: block;
    object-fit: cover;
}

.container {
    width: min(1160px, 90%);
    margin: auto;
}

.section {
    padding: 100px 0;
}

.section-label {
    color: var(--cyan);
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 15px;
}

.section-title {
    font-family: "Orbitron", sans-serif;
    font-size: clamp(28px, 4vw, 43px);
    line-height: 1.25;
    margin-bottom: 18px;
}

.section-description {
    color: var(--muted);
    max-width: 620px;
    line-height: 1.8;
}

.gradient-text {
    background: linear-gradient(90deg, #1680ff, #00e5ff);
    -webkit-background-clip: text;
    color: transparent;
}

.primary-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 14px 24px;
    background: linear-gradient(110deg, #1268ef, #00bfe8);
    color: white;
    border-radius: 8px;
    font-weight: 800;
    border: none;
    transition: .3s;
}

.primary-button:hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 35px rgba(0, 175, 255, .3);
}

.outline-button {
    display: inline-flex;
    padding: 13px 23px;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: white;
    transition: .3s;
}

.outline-button:hover {
    border-color: var(--cyan);
    color: var(--cyan);
}

.section-divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, #1677ff, transparent);
    opacity: .4;
}

/* CABEÇALHO */
.main-header {
    position: sticky;
    top: 0;
    z-index: 1000;
    background: rgba(5, 11, 24, .88);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
}

.navbar {
    min-height: 78px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    font-family: "Orbitron", sans-serif;
    font-size: 23px;
    font-weight: 800;
    letter-spacing: 2px;
}

.logo span {
    color: var(--cyan);
}

.nav-links {
    display: flex;
    gap: 30px;
    align-items: center;
    list-style: none;
}

.nav-links a {
    color: #c0cee3;
    font-size: 14px;
    transition: .3s;
}

.nav-links a:hover {
    color: var(--cyan);
}

.menu-button {
    display: none;
    background: none;
    border: 0;
    color: white;
    font-size: 28px;
}

/* HERO */
.hero {
    position: relative;
    min-height: 650px;
    display: flex;
    align-items: center;
    overflow: hidden;
    background:
        radial-gradient(circle at 80% 45%, rgba(0, 132, 255, .2), transparent 32%),
        radial-gradient(circle at 15% 80%, rgba(0, 217, 255, .09), transparent 30%);
}

.hero::before {
    content: "";
    position: absolute;
    width: 450px;
    height: 450px;
    border: 1px solid rgba(0, 217, 255, .13);
    border-radius: 50%;
    right: 8%;
    top: 15%;
    box-shadow: 0 0 80px rgba(0, 128, 255, .13);
}

.hero-content {
    position: relative;
    z-index: 2;
    max-width: 760px;
}

.hero-tag {
    display: inline-block;
    padding: 9px 15px;
    border: 1px solid rgba(0, 217, 255, .35);
    background: rgba(0, 217, 255, .07);
    border-radius: 30px;
    color: var(--cyan);
    font-size: 12px;
    letter-spacing: 2px;
    margin-bottom: 25px;
}

.hero h1 {
    font-family: "Orbitron", sans-serif;
    font-size: clamp(38px, 6vw, 70px);
    line-height: 1.15;
    margin-bottom: 25px;
}

.hero p {
    color: #b1c2db;
    max-width: 580px;
    font-size: 17px;
    line-height: 1.8;
    margin-bottom: 32px;
}

.hero-actions {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
}

.hero-orbit {
    position: absolute;
    width: 330px;
    height: 330px;
    border: 1px solid rgba(0, 217, 255, .25);
    border-radius: 50%;
    right: 13%;
    top: 25%;
    animation: orbit 18s linear infinite;
}

.hero-orbit::before {
    content: "";
    position: absolute;
    width: 18px;
    height: 18px;
    background: var(--cyan);
    border-radius: 50%;
    top: 20px;
    left: 60px;
    box-shadow: 0 0 25px var(--cyan);
}

@keyframes orbit {
    to { transform: rotate(360deg); }
}

/* SOBRE */
.about-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 60px;
    align-items: center;
}

.about-visual {
    min-height: 380px;
    position: relative;
    border: 1px solid var(--border);
    border-radius: 18px;
    overflow: hidden;
    background:
        linear-gradient(135deg, rgba(0, 105, 255, .25), rgba(0, 217, 255, .05)),
        url("https://images.unsplash.com/photo-1519389950473-47ba0277781c?w=1000") center/cover;
}

.about-visual::after {
    content: "IDEIAS • DESIGN • TECNOLOGIA";
    position: absolute;
    bottom: 25px;
    left: 25px;
    font-family: "Orbitron", sans-serif;
    font-size: 13px;
    letter-spacing: 2px;
    color: white;
    text-shadow: 0 2px 12px #000;
}

.about-points {
    display: grid;
    gap: 17px;
    margin-top: 28px;
}

.about-point {
    display: flex;
    gap: 14px;
    align-items: flex-start;
    color: #c3d2e8;
    line-height: 1.6;
}

.about-point strong {
    color: white;
}

/* SERVIÇOS */
.services-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 22px;
    margin-top: 45px;
}

.service-card {
    padding: 30px;
    border: 1px solid var(--border);
    background: linear-gradient(145deg, #0d1c34, #081222);
    border-radius: 14px;
    transition: .3s;
}

.service-card:hover {
    transform: translateY(-7px);
    border-color: var(--cyan);
    box-shadow: 0 15px 40px rgba(0, 100, 255, .12);
}

.service-icon {
    font-size: 32px;
    margin-bottom: 20px;
}

.service-card h3 {
    margin-bottom: 12px;
}

.service-card p {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.8;
}

/* PROJETOS */
.projects-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 22px;
    margin-top: 45px;
}

.project-card {
    overflow: hidden;
    border-radius: 15px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    transition: .3s;
}

.project-card:hover {
    transform: translateY(-7px);
    border-color: var(--cyan);
}

.project-image {
    height: 205px;
    overflow: hidden;
}

.project-image img {
    height: 100%;
    transition: .5s;
}

.project-card:hover .project-image img {
    transform: scale(1.06);
}

.project-info {
    padding: 23px;
}

.project-info span {
    color: var(--cyan);
    font-size: 11px;
    letter-spacing: 2px;
    font-weight: 800;
}

.project-info h3 {
    margin: 10px 0;
    font-size: 21px;
}

.project-info p {
    color: var(--muted);
    line-height: 1.7;
    font-size: 14px;
    margin-bottom: 20px;
}

.project-link {
    color: var(--cyan);
    font-weight: 700;
    font-size: 14px;
}

/* CONTATO */
.contact-box {
    padding: 55px;
    text-align: center;
    border: 1px solid rgba(0, 217, 255, .3);
    border-radius: 20px;
    background:
        radial-gradient(circle at top, rgba(0, 120, 255, .18), transparent 60%),
        #091529;
}

.contact-box p {
    color: var(--muted);
    line-height: 1.8;
    margin: 15px auto 25px;
    max-width: 550px;
}

/* BOTÃO FLUTUANTE WHATSAPP */
.whatsapp-float {
    position: fixed;
    right: 25px;
    bottom: 25px;
    z-index: 2000;
    width: 62px;
    height: 62px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #25D366;
    color: white;
    border-radius: 50%;
    box-shadow: 0 5px 25px rgba(37, 211, 102, .35);
    transition: .3s;
}

.whatsapp-float:hover {
    transform: translateY(-5px) scale(1.06);
    box-shadow: 0 8px 30px rgba(37, 211, 102, .5);
}

.whatsapp-float svg {
    width: 34px;
    height: 34px;
    fill: currentColor;
}

/* RODAPÉ */
.main-footer {
    padding: 30px 0;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 13px;
}

.footer-content {
    display: flex;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
}

/* THE GARRISON */
.demo {
    scroll-margin-top: 80px;
}

.garrison {
    --g-black: #101010;

}

.garrison .demo-heading {

}

.garrison .demo-heading small {
    color: var(--g-accent);

}

.garrison .demo-heading h2 {

}

.garrison .garrison-services {
    display: grid;

    gap: 20px;
}

.garrison .g-service {
    padding: 30px;
    background: var(--g-card);
    border: 1px solid #333;

}

.garrison .g-service .symbol {

.garrison .g-service h3 {

.garrison .g-service p {

.garrison .g-service strong {

.garrison .garrison-gallery {

.garrison .garrison-gallery img {

}

.garrison .garrison-about {
    display: grid;

}

.garrison .garrison-about img {
    height: 370px;
}

.garrison .garrison-about p {
